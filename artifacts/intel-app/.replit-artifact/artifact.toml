kind = "web"
previewPath = "/"
title = "Intelligence Analyzer"
version = "1.0.0"
id = "artifacts/intel-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23825
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/intel-app run dev"

[services.env]
PORT = "23825"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/intel-app", "run", "build"]
publicDir = "artifacts/intel-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
